name: Deploy via FTP

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ftp-deploy
  # queue instead of cancel: an upload aborted halfway would leave a mixed site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      # Optional: target directory on the server (defaults to the FTP home directory).
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
      # Optional: set to "false" for plain FTP if the host does not support FTPS (default: TLS on).
      FTP_TLS: ${{ vars.FTP_TLS }}
      # Optional: set to "false" only if the FTPS certificate does not match FTP_SERVER
      # (default: verified, so nobody in between can read the password).
      FTP_VERIFY_CERT: ${{ vars.FTP_VERIFY_CERT }}
      # Optional: canonical site URL (no trailing slash). If set, it replaces the default
      # domain in the share tags, canonical links, sitemap.xml and robots.txt at deploy time.
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Point the absolute URLs (og:url, og:image, canonical, sitemap) at the
      # configured domain. Without SITE_URL the built-in default is kept.
      - name: Set share URLs
        if: ${{ env.FTP_SERVER != '' && env.SITE_URL != '' }}
        run: |
          BASE="${SITE_URL%/}"
          find . \( -name '*.html' -o -name 'sitemap.xml' -o -name 'robots.txt' \) \
            -not -path './.git/*' -not -path './.github/*' -print0 \
            | xargs -0 sed -i "s#https://478breathing\.hydrax\.org#${BASE}#g"
          echo "Set share URLs to ${BASE}"

      - name: Check FTP secrets
        if: ${{ env.FTP_SERVER == '' }}
        run: |
          echo "::warning::FTP secrets are missing. Set FTP_SERVER, FTP_USERNAME and FTP_PASSWORD (environment: production) and re-run. Skipping deploy for now."

      # Append the commit SHA to the CSS/JS URLs so browsers fetch the new version
      # instead of a cached one (see the Expires headers in .htaccess).
      - name: Cache-bust CSS/JS
        if: ${{ env.FTP_SERVER != '' }}
        run: |
          VER="${GITHUB_SHA:0:8}"
          # every local CSS/JS reference, so new files are covered automatically
          find . -name '*.html' -not -path './.git/*' -not -path './.github/*' -print0 \
            | xargs -0 sed -i -E \
              "s#(src|href)=\"([A-Za-z0-9._-]+\.(css|js))\"#\1=\"\2?v=${VER}\"#g"
          echo "Stamped CSS/JS with ?v=${VER}"

      - name: Install lftp
        if: ${{ env.FTP_SERVER != '' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp mirrors the working tree to the server. Explicit FTPS (AUTH TLS) is used
      # by default; set the FTP_TLS variable to "false" for plain FTP.
      #
      # Two passes, so a visitor never gets new HTML pointing at an asset that is not
      # there yet (it would be cached under the new ?v= URL for days):
      #   1. everything except HTML, 2. the HTML plus deleting what left the repo.
      # Each file is written to a temporary name and renamed into place, so no file
      # is ever missing for a moment (not even .htaccess).
      - name: Deploy via lftp
        if: ${{ env.FTP_SERVER != '' }}
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          TARGET="${FTP_SERVER_DIR:-.}"
          if [ "${FTP_TLS:-true}" = "false" ]; then
            SSL="set ftp:ssl-allow false;"
          else
            VERIFY="yes"
            [ "${FTP_VERIFY_CERT:-true}" = "false" ] && VERIFY="no"
            SSL="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate ${VERIFY};"
          fi
          EXCLUDES="--exclude '(^|/)\.git' \
            --exclude '(^|/)\.github/' \
            --exclude '(^|/)\.claude/' \
            --exclude '(^|/)\.gitignore\$' \
            --exclude '\.md\$' \
            --exclude '(^|/)LICENSE\$' \
            --exclude '(^|/)\.DS_Store\$'"
          lftp -c "
            set cmd:fail-exit true;
            ${SSL}
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 20;
            set xfer:use-temp-file yes;
            open --env-password -u '${FTP_USERNAME}' '${FTP_SERVER}';
            mirror --reverse --overwrite --verbose --parallel=1 ${EXCLUDES} \
              --exclude-glob '*.html' ./ '${TARGET}';
            mirror --reverse --overwrite --delete --verbose --parallel=1 ${EXCLUDES} \
              ./ '${TARGET}';
          "
